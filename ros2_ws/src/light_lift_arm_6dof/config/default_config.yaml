# 机械臂默认控制模式配置
# 模式对应关系:
#   0 - AutoServo      (电机内部MIT控制)
#   1 - ManualServo    (手动通过纯力矩控制电机)
#   2 - Impdence       (阻抗控制)
#   3 - Admittance     (导纳控制)
#   4 - Gravity        (重力补偿)
#   5 - JointAutoServo (关节自动控制)
#   6 - Zero           (设置零点)
#   7 - Planning       (以规划的轨迹到达期望点)
#   8 - Gohome         (关节归零)

default_mode: 2

# 控制选项
# 是否启用末端轨迹更新 (true/false)
# 注意：当进行话题控制时，应设置为 false
enable_end_effector_trajectory_update: true

# 末端轨迹参数
trajectory:
  # 振荡频率系数
  rate: 2.0

  # 各轴振荡幅度（如果为0则该轴不振荡）
  amplitude_x: 0.0
  amplitude_y: 0.0
  amplitude_z: 0.0
  amplitude_rot_x: 0.0
  amplitude_rot_y: 0.0
  amplitude_rot_z: 0.0

  # 末端执行器默认位置 [x, y, z, roll, pitch, yaw]
  default_position:
    x: 0.4
    y: 0.0
    z: 0.2
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# AutoServo模式控制参数
# 这些参数用于手动PID控制，计算电机控制力矩
autoservo_control:
  # 位置增益 (kp) - 针对6个电机
  kp:
    motor0: 350.0
    motor1: 300.0
    motor2: 280.0
    motor3: 10.0
    motor4: 0.0
    motor5: 0.0

  # 速度增益 (kd) - 针对6个电机
  kd:
    motor0: 1.9
    motor1: 2.0
    motor2: 2.0
    motor3: 0.6
    motor4: 0.0
    motor5: 0.0

# ManualServo模式控制参数
# 电机pid为零，仅用力矩控制，手动实现pid
manualservo_control:
  # 位置增益 (kp) - 针对6个电机
  kp:
    motor0: 315.0
    motor1: 315.0
    motor2: 312.0
    motor3: 20.0
    motor4: 20.0
    motor5: 20.0

  # 速度增益 (kd) - 针对6个电机
  kd:
    motor0: 1.43
    motor1: 1.43
    motor2: 1.73
    motor3: 0.53
    motor4: 0.43
    motor5: 0.33
